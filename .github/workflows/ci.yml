name: ci

# push・PR時にmobileアプリのtypecheck/lint/testを自動実行する。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    # アプリの日時表示（応募締切等）は端末のローカルタイムゾーンをJST前提で組んでおり、
    # テストもその前提に依存している。GitHub Actionsランナーの既定TZ(UTC)のままだと
    # 9時間ずれて多数のテストが失敗するため、実際の利用者（日本国内）に合わせて固定する。
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run mobile:typecheck
      - run: npm run mobile:lint
      - run: npm run mobile:test
